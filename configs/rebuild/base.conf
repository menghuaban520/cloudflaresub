# 花瓣 Rebuild 1.0-beta.2 — 国内 App 分流补充，基于已反馈可连接的 beta.1
# 已知国内直连；国外/未知跟随首页手动节点；无远程规则依赖。
# 本地解析使用直连加密 DNS，普通代理域名由节点解析。
# 不保证所有国外 DNS 经代理，不保证系统级零泄漏；详见 REBUILD.md。

[General]
dns-server = https://dns.alidns.com/dns-query#no-h3,https://doh.pub/dns-query#no-h3
fallback-dns-server = https://doh.pub/dns-query#no-h3,https://dns.alidns.com/dns-query#no-h3
proxy-dns-server = https://dns.alidns.com/dns-query#no-h3,https://doh.pub/dns-query#no-h3
dns-direct-system = false
dns-fallback-system = false
dns-direct-fallback-proxy = false
always-ip-address = false
ipv6 = false
prefer-ipv6 = false
udp-policy-not-supported-behaviour = REJECT
close-if-proxy-chain-missing = true

[Rule]
# DNS 上游独立引导，不依赖当前代理可用。
DOMAIN,dns.alidns.com,DIRECT
DOMAIN,doh.pub,DIRECT
IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
IP-CIDR,223.6.6.6/32,DIRECT,no-resolve
IP-CIDR,1.12.12.12/32,DIRECT,no-resolve
IP-CIDR,120.53.53.53/32,DIRECT,no-resolve
# 局域网与门户认证。
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,local,DIRECT
DOMAIN-SUFFIX,lan,DIRECT
DOMAIN,captive.apple.com,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
# @USER_PROXY@
# @USER_DIRECT@
# 小范围广告阻断；用户覆盖可先行纠正误拦。
DOMAIN,ad.toutiao.com,REJECT
DOMAIN,ad.weibo.com,REJECT
DOMAIN,ad.ximalaya.com,REJECT
DOMAIN,ad.api.3g.youku.com,REJECT
DOMAIN,api.ad.xiaomi.com,REJECT
# 国外服务补充，不依赖大型外部列表。
DOMAIN-SUFFIX,google.cn,PROXY
DOMAIN-SUFFIX,google.com.hk,PROXY
DOMAIN-SUFFIX,x.ai,PROXY
DOMAIN-SUFFIX,grok.com,PROXY
DOMAIN-SUFFIX,twimg.com,PROXY
DOMAIN-SUFFIX,tiktok.com,PROXY
DOMAIN-SUFFIX,tiktokv.com,PROXY
DOMAIN-SUFFIX,tiktokcdn.com,PROXY
DOMAIN-SUFFIX,tiktokcdn-us.com,PROXY
DOMAIN-SUFFIX,byteoversea.com,PROXY
DOMAIN-SUFFIX,ibytedtos.com,PROXY
DOMAIN-SUFFIX,ibyteimg.com,PROXY
# 国内 App 补充：只扩展域名分流，保持已可用的连接参数。
# 微信：头像、小程序、支付与辅助服务。
DOMAIN-SUFFIX,qlogo.cn,DIRECT
DOMAIN-SUFFIX,servicewechat.com,DIRECT
DOMAIN-SUFFIX,wechatpay.com,DIRECT
DOMAIN-SUFFIX,weixinbridge.com,DIRECT
DOMAIN-SUFFIX,weixinsxy.com,DIRECT
DOMAIN-SUFFIX,wechatos.net,DIRECT
# 抖音：视频与指定资源主机；不放行整个共享 CDN。
DOMAIN-SUFFIX,idouyinvod.com,DIRECT
DOMAIN-SUFFIX,ixiguavideo.com,DIRECT
DOMAIN,lf3-static.bytednsdoc.com,DIRECT
DOMAIN,v5-dy-o-abtest.zjcdn.com,DIRECT
# 酷狗：主服务、歌曲资源、图片及链接。
DOMAIN-SUFFIX,kugou.com,DIRECT
DOMAIN-SUFFIX,kugou.net,DIRECT
DOMAIN-SUFFIX,kugoo.com,DIRECT
DOMAIN-SUFFIX,kgimg.com,DIRECT
DOMAIN-SUFFIX,kglink.cn,DIRECT
DOMAIN-SUFFIX,kugouipv6.com,DIRECT
# 同类音乐服务：酷我；QQ 音乐、网易云已由 qq.com / 163.com 核心规则覆盖。
DOMAIN-SUFFIX,kuwo.cn,DIRECT
DOMAIN-SUFFIX,koowo.com,DIRECT
DOMAIN-SUFFIX,koowo.cn,DIRECT
# @CHINA_CORE@
DOMAIN-SUFFIX,12306.cn,DIRECT
GEOIP,CN,DIRECT,no-resolve
FINAL,PROXY

[Host]
localhost = 127.0.0.1
dns.alidns.com = 223.5.5.5
doh.pub = 1.12.12.12
