name: Shadowrocket checks
on:
  push:
    paths: ['docs/shadowrocket/**', 'README.md', 'configs/**', 'public/shadowrocket*', 'public/customize/**', 'scripts/build_shadowrocket*.py', 'scripts/package_shadowrocket.py', 'tests/shadowrocket*', '.github/workflows/shadowrocket.yml']
  pull_request:
    paths: ['docs/shadowrocket/**', 'README.md', 'configs/**', 'public/shadowrocket*', 'public/customize/**', 'scripts/build_shadowrocket*.py', 'scripts/package_shadowrocket.py', 'tests/shadowrocket*', '.github/workflows/shadowrocket.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/shadowrocket_customizer_test.mjs
      - run: python3 scripts/build_shadowrocket.py --check
      - run: python3 scripts/build_shadowrocket_rebuild.py --check
      - run: python3 -m unittest discover -s tests -p 'shadowrocket*_test.py' -v
      - run: python3 scripts/package_shadowrocket.py
      - uses: actions/upload-artifact@v4
        with:
          name: huaban-rebuild-beta
          path: dist/huaban-rebuild-beta.zip
          if-no-files-found: error
